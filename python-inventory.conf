<VirtualHost *:8080>
    ServerName _default_
    WSGIDaemonProcess python_inventory user=www-data group=www-data threads=5 python-home=/var/www/python-inventory/venv python-path=/var/www/python-inventory
    WSGIProcessGroup python_inventory
    WSGIScriptAlias / /var/www/python-inventory/app.wsgi

    <Directory /var/www/python-inventory>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/python-inventory-error.log
    CustomLog ${APACHE_LOG_DIR}/python-inventory-access.log combined
</VirtualHost>
